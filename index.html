<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">

<title>Tugas Penundaan Imbalan</title>
<style>
:root{--ink:#1B1340;--bg:#E6DEFF;--lemon:#FFD23F;--mute:#4A4270}

.st .n{flex:none;width:38px;height:38px;border:3px solid var(--ink);border-radius:50%;background:var(--lemon);font-weight:900;display:flex;align-items:center;justify-content:center}

.breath{width:150px;height:150px;border-radius:50%;background:var(--lemon);border:3px solid var(--ink);margin:20px auto;animation:br 8s ease-in-out infinite}

@media (prefers-reduced-motion:reduce){.breath{animation:none}}
@media print{
body{background:#fff;font-size:11.5pt}
main{max-width:none;padding:0}
.panel{border:0;box-shadow:none;padding:0}
.noprint{display:none!important}
h2{break-after:avoid}
svg.ch,.tbl,.refs li{break-inside:avoid}
@page{margin:16mm}
}
</style>

const ST=[
 {n:"Hijau",c:"#12A87A",v0:1,g:0.5,hs:[0.05,0.09,0.14],sh:"circle",tk:450},

function pid(){const e=document.getElementById("pid");return ((e&&e.value)||PID).trim().replace(/[",\r\n]/g," ").replace(/^[=+\-@]/,"'$&")}
function dl(name,H,R){

const dv=x=>({wt:sec(x.n,x.s),bg:sec(x.Tb-x.Tt,x.s),cg:sec(x.n-x.Tb,x.s),a:ev(x.s,x.n,x.h),r:ev(x.s,x.Tb,x.h),t:ev(x.s,x.Tt,x.h),auto:!x.burst&&x.n>=capT(x.s)+EXTRA});
function Phi(x){const z=Math.abs(x)/Math.SQRT2,t=1/(1+0.3275911*z),y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-z*z);return x>=0?0.5*(1+y):0.5*(1-y)}
const GD=[],GS=[];for(let d=-6;d<=6.001;d+=.25)GD.push(d);for(let q=.25;q<=6.001;q+=.25)GS.push(q);
function fitCens(L){
  const rows=L.map(x=>({m:x.Tb,n:x.n,c:x.burst||x.n>=capT(x.s)+EXTRA}));
  let best=-Infinity,bd=0,bs=1;
  for(const d of GD)for(const q of GS){
    let ll=0;
    for(const r of rows){const mu=r.m+d;let p;
      if(r.c)p=1-Phi((r.n-.5-mu)/q);
      else p=Phi((r.n+.5-mu)/q)-(r.n===0?0:Phi((r.n-.5-mu)/q));
      ll+=Math.log(Math.max(p,1e-12))}
    if(ll>best){best=ll;bd=d;bs=q}
  }

}
function lossScore(L,d,q){
  let a=0,b=0;
  L.forEach(x=>{const K=capT(x.s)+EXTRA,e=[];for(let T=0;T<=K;T++)e.push(ev(x.s,T,x.h));
    let ex=0,prev=0;for(let T=0;T<=K;T++){const c=T===K?1:Phi((T+.5-(x.Tb+d))/q);ex+=(c-prev)*e[T];prev=c}
    const ref=e[Math.min(x.Tb,K)];a+=ref-ex;b+=ref-e.reduce((u,v)=>u+v,0)/e.length});
  return b>1e-9?1-a/b:0;
}
function skill(L){if(L.length<5)return{d:0,sg:1,sc:0};const f=fitCens(L);return{d:f[0],sg:f[1],sc:lossScore(L,f[0],f[1])}}
function csv(){

  const R=log.map((x,i)=>{const d=dv(x),b=x.burst;return [SID,pid(),STAMP,LG,i+1,Math.floor(i/PER)+1,x.s?"red":"green",REGE[x.reg],x.h,ST[x.s].tk,x.n,b?1:0,d.auto?1:0,x.pts,b?"":d.wt.toFixed(3),sec(x.Tb,x.s).toFixed(3),sec(x.Tt,x.s).toFixed(3),d.bg.toFixed(3),b?"":d.cg.toFixed(3),b?"":d.a.toFixed(4),d.r.toFixed(4),d.t.toFixed(4),x.H.toFixed(4),x.ok?1:0,x.Tb,x.Tt]});

function csvSum(){
  const T=L=>L.filter(x=>!x.burst),m=(a,f)=>a.length?+mean(a.map(f)).toFixed(4):"";
  const MET=[["mean_points",L=>m(L,x=>x.pts)],["pop_rate",L=>m(L,x=>x.burst?1:0)],["mean_wait_sec",L=>m(T(L),x=>dv(x).wt)],["belief_gap_sec",L=>m(L,x=>dv(x).bg)],["control_gap_sec",L=>m(T(L),x=>dv(x).cg)],["control_gap_abs_sec",L=>m(T(L),x=>Math.abs(dv(x).cg))],["regret_belief",L=>m(T(L),x=>{const d=dv(x);return d.t-d.r})],["regret_control",L=>m(T(L),x=>{const d=dv(x);return d.r-d.a})],["regret_total",L=>m(T(L),x=>{const d=dv(x);return d.t-d.a})]];
  const SUB=[["",()=>true],["_green",x=>x.s===0],["_red",x=>x.s===1],["_calm",x=>x.reg===0],["_medium",x=>x.reg===1],["_wild",x=>x.reg===2],["_odd",(x,i)=>i%2===0],["_even",(x,i)=>i%2===1]];
  const tk=T(log),tot=log.reduce((a,x)=>a+x.pts,0),rate=f=>tk.length?+(tk.filter(f).length/tk.length).toFixed(4):"";
  const H=["session_id","participant_id","timestamp","language","n_rounds","total_points","n_popped","n_auto_taken","mood_match_rate","mean_entropy_bits","early_take_rate","late_take_rate","ontarget_rate","points_efficiency"];
  const V=[SID,pid(),STAMP,LG,log.length,tot,log.length-tk.length,tk.filter(x=>dv(x).auto).length,m(log,x=>x.ok?1:0),m(log,x=>x.H),rate(x=>x.n<x.Tb),rate(x=>x.n>x.Tb),rate(x=>x.n===x.Tb),+(tot/log.reduce((a,x)=>a+dv(x).t,0)).toFixed(4)];
  const K=skill(log),Ko=skill(log.filter((x,i)=>i%2===0)),Ke=skill(log.filter((x,i)=>i%2===1)),ms=mean(log.map(x=>ST[x.s].tk))/1000,r4=v=>+v.toFixed(4);
  H.push("control_skill","delta_ticks","sigma_ticks","delta_sec","sigma_sec","control_skill_odd","control_skill_even");V.push(r4(K.sc),K.d,K.sg,r4(K.d*ms),r4(K.sg*ms),r4(Ko.sc),r4(Ke.sc));

  const bsSc=BS.map((x,i)=>x?(BS_REV[i]?6-x:x):0),bsTot=bsSc.reduce((a,b)=>a+b,0);

}
function autoSend(){
  if(!ENDPOINT||SENT===SID)return;

   .then(()=>say(t("Data sudah dikirim ke peneliti. Terima kasih!","Data sent to the researcher. Thank you!")))

const val=(s,n)=>Math.min(10,ST[s].v0+ST[s].g*n);
const capT=s=>Math.ceil((10-ST[s].v0)/ST[s].g);
const ev=(s,T,h)=>Math.pow(1-h,Math.max(0,T-GRACE))*val(s,T);
function bestT(s,w){let b=0,bv=-1;for(let T=0;T<=capT(s);T++){let v=0;ST[s].hs.forEach((h,i)=>v+=w[i]*ev(s,T,h));if(v>bv+1e-9){bv=v;b=T}}return b}

let hs=0;
const HK=()=>[
t('<h1>Jam 23.40.</h1><p class="story">Tugas dikumpul besok pagi, dan baru separuh jadi. Lalu HP-mu bergetar: ada video yang katanya lucu banget.</p><p class="story">Kamu tahu seharusnya lanjut mengerjakan. Tapi satu video saja, kan? Sebentar doang.</p>',
'<h1>11:40 p.m.</h1><p class="story">The assignment is due tomorrow morning, and it is only half done. Then your phone buzzes: a video everyone says is hilarious.</p><p class="story">You know you should keep working. But just one video, right? Only a minute.</p>'),
t('<h1>Atau yang ini.</h1><p class="story">Sepatu incaranmu diskon, dan tinggal hari ini. Uangnya sebenarnya sedang kamu tabung untuk hal lain.</p><p class="story">Nenekmu pernah bilang, “Sabar, nanti ada rezekinya.” Tapi sabar sampai kapan? Dan bagaimana kalau yang ditunggu tidak pernah datang?</p>',
'<h1>Or this one.</h1><p class="story">The shoes you have wanted are on sale, today only. The money is actually your savings for something else.</p><p class="story">Your grandmother once told you, “Be patient, good things will come.” But patient until when? And what if what you are waiting for never comes?</p>'),

let BT;
function breath(){
  VIEW=breath;cur=null;clearInterval(BT);
  const done=plan.slice(0,bi).filter(x=>!x.prac).length;let n=16,ph=0;
  show('<h1>'+t("Blok "+done+" dari 4 selesai","Block "+done+" of 4 done")+'</h1><div class="breath" aria-hidden="true"></div><p id="bp" role="status" style="text-align:center;font-weight:800;font-size:1.2rem;margin:0 0 8px"></p><p style="text-align:center">'+t("Tarik napas panjang dulu. Tarik lewat hidung, hembuskan pelan lewat mulut, ulangi beberapa kali.","Take a long breath first. In through your nose, out slowly through your mouth, a few times.")+'</p><button id="bgo" disabled style="width:100%"></button>',false);
  const bp=document.getElementById("bp"),bg=document.getElementById("bgo");
  const set=()=>{bp.textContent=ph%2?t("Hembuskan pelan...","Breathe out slowly..."):t("Tarik napas...","Breathe in...")};
  const lab=()=>{bg.textContent=n>0?t("Lanjut ("+n+")","Continue ("+n+")"):t("Lanjut ke blok berikutnya","Continue to the next block")};
  set();lab();
  BT=setInterval(()=>{n--;if(n>0&&n%4===0){ph++;set()}lab();if(n<=0){bg.disabled=false;clearInterval(BT)}},1000);
  bg.onclick=()=>{if(!bg.disabled){clearInterval(BT);blockIntro()}};
}
function begin(){
  plan=[{s:0,n:7,prac:true},{s:1,n:7,prac:true}].concat(shuffle([0,1,0,1]).map(s=>({s,n:PER})));
  bi=0;rd=0;log=[];score=0;blockIntro();
}
const nm=s=>t("Kondisi "+ST[s].n,(s?"Red":"Green")+" condition");
function blockIntro(){
  VIEW=blockIntro;GO_AT=Date.now()+400;
  const p=plan[bi],s=p.s,real=plan.slice(0,bi).filter(x=>!x.prac).length+1;
  belief=PRIOR.slice();reg=Math.floor(Math.random()*3);
  show('<h1>'+(p.prac?t("Latihan: ","Practice: "):t("Blok "+real+" dari 4: ","Block "+real+" of 4: "))+nm(s)+'</h1><svg viewBox="0 0 200 200" class="ball" style="width:150px" aria-hidden="true">'+shape(s,6,false).replace(/<text.*<\/text>/,"")+'</svg><p>'+(p.prac?t("Tujuh putaran untuk mencoba. Tidak dihitung.","Seven rounds to try it out. Not counted."):t("50 putaran di kondisi ini.","50 rounds in this condition."))+t(" Tingkat risiko diacak ulang di awal blok, jadi pelajari lagi dari awal."," The risk level is re-randomized at the start of each block, so learn it afresh.")+'</p><button id="go">'+t("Mulai (spasi)","Start (space)")+"</button>",true);
  document.getElementById("go").onclick=()=>{if(document.getElementById("go"))startRound()};
}
function startRound(){
  const p=plan[bi],s=p.s;
  if(rd>0&&Math.random()<EPS){const o=[0,1,2].filter(i=>i!==reg);reg=o[Math.floor(Math.random()*2)]}
  const b=trans(belief);
  cur={bi,s,reg,h:ST[s].hs[reg],Tb:bestT(s,b),Tt:bestT(s,[0,1,2].map(i=>i===reg?1:0)),H:ent(b),ok:am(b)===reg,n:0,done:false,b:b};
  const real=plan.slice(0,bi).filter(x=>!x.prac).length+1;
  show('<div class="top"><span>'+(p.prac?t("Latihan","Practice"):t("Blok ","Block ")+real+"/4")+" · "+nm(s)+'</span><span>'+t("Putaran ","Round ")+(rd+1)+"/"+p.n+'</span><span>'+t("Skor ","Score ")+score+'</span></div><div class="bar"><i style="width:'+(rd/p.n*100)+'%"></i></div><svg class="ball" id="ball" viewBox="0 0 200 200" role="img" aria-label="Imbalan">'+shape(s,val(s,0),false)+'</svg><button class="take" id="take">'+t("Ambil","Take")+'</button><p class="mute" id="msg" role="status" style="text-align:center;margin:12px 0 0">'+t("Pikirkan dulu. Tekan Ambil atau spasi sebelum hangus.","Think first. Press Take or space before it expires.")+'</p>');
  document.getElementById("take").onclick=()=>{if(!cur.done)end(false)};
  document.getElementById("take").focus();
  timer=setTimeout(()=>{if(!cur.done)timer=setInterval(tick,ST[cur.s].tk)},700);
}
function tick(){
  if(cur.done)return;
  cur.n++;
  if(cur.n>GRACE&&Math.random()<cur.h){end(true);return}
  document.getElementById("ball").innerHTML=shape(cur.s,val(cur.s,cur.n),false);
  if(cur.n>=capT(cur.s)+EXTRA)end(false);
}
function end(burst){
  clearInterval(timer);clearTimeout(timer);cur.done=true;
  const m=document.getElementById("msg");document.getElementById("take").disabled=true;
  let pts=0;
  if(burst){document.getElementById("ball").innerHTML=shape(cur.s,val(cur.s,cur.n-1),true);m.textContent=t("Hangus. Poin putaran ini hilang.","Expired. This round’s points are lost.")}
  else{pts=val(cur.s,cur.n);if(!plan[cur.bi].prac)score+=pts;m.textContent=t("Tersimpan: ","Banked: ")+fmt(pts)+t(" poin"," points")}
  if(!plan[cur.bi].prac)log.push({blk:cur.bi,s:cur.s,reg:cur.reg,h:cur.h,Tb:cur.Tb,Tt:cur.Tt,H:cur.H,ok:cur.ok,n:cur.n,burst:burst,pts:pts});
  belief=upd(cur.b,cur.s,cur.n,burst);
  setTimeout(next,900);
}
function next(){
  rd++;
  if(rd>=plan[bi].n){const was=plan[bi];bi++;rd=0;if(bi>=plan.length){result();return}if(!was.prac){breath();return}blockIntro();return}
  startRound();
}

function chart(series,ymax,label){

  });
  series.forEach(se=>{

  const fx=v=>LG==="id"?String(v).replace(".",","):String(v);
  const ex=[[4,"3","2.080"],[5,"3.5","2.154"],[6,"4","2.187"],[7,"4.5","2.190"],[8,"5","2.168"]].map(r=>"<tr><td>"+r[0]+"</td><td>"+fx(r[1])+"</td><td>"+fx(r[2])+(r[0]===7?c(" (terbaik)"," (best)"):"")+"</td></tr>").join("");
  const EXPL='<h2>'+c("Cara membaca grafik dan cara menghitungnya","How to read the chart and how it is calculated")+'</h2><ul><li>'+c("<b>Titik hitam</b>: kapan kamu benar-benar menekan Ambil. Hanya ada untuk putaran yang kamu Ambil.","<b>Black dots</b>: when you actually pressed Take. Only for rounds you banked.")+'</li><li>'+c("<b>Garis oranye (ideal rasional dari pengalamanmu)</b>: waktu berhenti terbaik menurut hitungan, kalau seseorang menalar dengan benar dari riwayat putaran yang sama persis denganmu. Ini bukan isi kepalamu dan bukan tebakan yang kamu ketik: tes ini tidak menanyakan tebakanmu.","<b>Orange line (rational ideal from your experience)</b>: the best stopping time by calculation, if someone reasoned correctly from exactly your round history. It is not what was in your head and not a guess you typed: the task does not ask for your guess.")+'</li><li>'+c("<b>Garis hijau (ideal sebenarnya)</b>: waktu berhenti terbaik kalau suasana aslinya diketahui pasti. Program tahu, kamu tidak.","<b>Green line (true ideal)</b>: the best stopping time if the condition’s real mood were known for certain. The program knows it, you do not.")+'</li></ul><p><b>'+c("Cara hitung tiap putaran","How each round is calculated")+'</b></p><ol><li>'+c("Keyakinan awal tiap blok: tenang, sedang, ganas = 33% / 33% / 33% (prior).","Starting belief of each block: calm, medium, wild = 33% / 33% / 33% (prior).")+'</li><li>'+c("Setelah tiap putaran, keyakinan diperbarui dengan aturan Bayes: hangus cepat menaikkan “ganas”, imbalan yang sempat penuh menaikkan “tenang”. Lalu digeser sedikit karena suasana bisa berganti (8% per putaran).","After each round the belief is updated by Bayes’ rule: an early expiry raises “wild”, a reward that got full raises “calm”. It is then shifted slightly because the mood can switch (8% per round).")+'</li><li>'+c("Untuk tiap tik T, hitung hasil rata-rata kalau berhenti di sana: poin di tik itu × peluang selamat sampai sana, dirata-rata dengan bobot keyakinan.","For each tick T, compute the average payoff of stopping there: points at that tick × chance of surviving to it, averaged with the belief as weights.")+'</li><li>'+c("Ambil T dengan hasil rata-rata tertinggi. Itu garis oranye. Garis hijau dihitung sama, tapi dengan suasana asli sebagai satu-satunya kemungkinan.","Pick the T with the highest average payoff. That is the orange line. The green line is computed the same way, but with the real mood as the only possibility.")+'</li></ol><p>'+c("Contoh di Kondisi Hijau, dengan keyakinan 10% tenang, 30% sedang, 60% ganas (peluang hangus 5%, 9%, 14%):","Example in the Green condition, with a belief of 10% calm, 30% medium, 60% wild (expiry chances 5%, 9%, 14%):")+'</p><table class="tbl"><tr><th>'+c("Berhenti di tik","Stop at tick")+'</th><th>'+c("Poin","Points")+'</th><th>'+c("Hasil rata-rata","Average payoff")+'</th></tr>'+ex+'</table><p class="mute">'+c("Terbaik di tik 7, yaitu 7 × 0,45 ≈ 3,2 detik. Kalau keyakinan lebih condong ke tenang, waktunya jauh lebih lama.","Best at tick 7, i.e. 7 × 0.45 ≈ 3.2 seconds. If the belief leaned more toward calm, the time would be much longer.")+'</p><p>'+c("<b>Kenapa oranye dan hijau bisa beda:</b> dari pengalaman, suasana asli tidak pernah bisa diketahui pasti. Rentetan sial membuat keyakinan terlalu ganas, rentetan mujur membuatnya terlalu tenang, dan setelah suasana berganti keyakinan butuh beberapa putaran untuk menyusul. <b>Kenapa hitam dan oranye bisa beda:</b> keputusanmu bisa dipengaruhi kebiasaan, takut rugi, bosan, buru-buru, atau godaan untuk terus menunggu. Selisih itulah yang dilaporkan sebagai “apa yang kamu lakukan”.","<b>Why orange and green can differ:</b> from experience alone, the real mood can never be known for certain. A run of bad luck makes the belief too wild, a lucky run makes it too calm, and after the mood switches the belief takes a few rounds to catch up. <b>Why black and orange can differ:</b> your decision can be shaped by habit, fear of loss, boredom, hurry, or the temptation to keep waiting. That gap is what is reported as “what you did”.")+'</p>';
  const SK=skill(log),msd=mean(log.map(x=>ST[x.s].tk))/1000;
  const dT=Math.abs(SK.d)<0.5?c("mendekati ideal","close to ideal"):SK.d>0?c("cenderung menunggu lebih lama dari ideal","tends to wait longer than ideal"):c("cenderung berhenti lebih cepat dari ideal","tends to stop sooner than ideal");
  const sT=SK.sg<1?c("sangat konsisten","very consistent"):SK.sg<2?c("cukup konsisten","fairly consistent"):c("cukup berubah-ubah","fairly variable");
  const HERO='<div class="hero"><div class="hl">'+c("Skor Kontrol","Control Skill Score")+'</div><div class="hn">'+fx(SK.sc.toFixed(2))+'</div><p style="margin:6px 0">'+c("1 = selalu mengikuti keputusan terbaik dari pengalamanmu sendiri, 0 = sama kacaunya dengan menekan acak, negatif = lebih buruk dari acak.","1 = always following the best decision from your own experience, 0 = as messy as pressing at random, negative = worse than random.")+'</p><p style="margin:0">'+c("Bias (δ) ","Bias (δ) ")+fx((SK.d>0?"+":"")+SK.d.toFixed(1))+c(" tik (≈ "," ticks (≈ ")+fx((SK.d*msd).toFixed(2))+c(" detik): "," s): ")+dT+c(". Konsistensi (σ) ",". Consistency (σ) ")+fx(SK.sg.toFixed(1))+c(" tik: "," ticks: ")+sT+".</p><p class=\"mute\" style=\"margin:6px 0 0\">"+c("Kata-kata ini patokan kasar, belum dinormalkan pada data peserta.","These wordings are rough guides, not yet normalized on participant data.")+"</p></div>";
  const SKX='<h2>'+c("Cara menghitung Skor Kontrol","How the Control Skill Score is calculated")+'</h2><ol><li>'+c("Tiap orang diasumsikan punya niat berhenti di sekitar waktu ideal rasional, ditambah bias δ, dengan sebaran acak σ.","Each person is assumed to intend to stop around the rational ideal time, plus a bias δ, with random spread σ.")+'</li><li>'+c("Putaran yang kamu Ambil memberi tahu niat berhentimu hampir tepat. Putaran yang hangus atau diambil otomatis hanya memberi tahu “setidaknya segini”. Semua putaran dipakai, tidak ada yang dibuang (data tersensor; Tobin, 1958).","A round you banked tells us your intended stop almost exactly. A round that expired or was auto-banked only tells us “at least this long”. Every round is used and none is discarded (censored data; Tobin, 1958).")+'</li><li>'+c("δ dan σ dipilih yang paling cocok dengan semua putaran sekaligus (kemungkinan terbesar).","δ and σ are chosen to fit all rounds at once (maximum likelihood).")+'</li><li>'+c("Dari δ dan σ, dihitung poin harapan yang hilang dibanding ideal rasional, lalu dibandingkan dengan perilaku acak. Skor = 1 − (kerugianmu ÷ kerugian acak).","From δ and σ, the expected points lost versus the rational ideal are computed and compared with random behavior. Score = 1 − (your loss ÷ random loss).")+'</li></ol><p class="mute">'+c("Skor ini bergantung pada model hitungan (bukan tebakan yang kamu ketik), ikut turun karena takut rugi, bosan, atau buru-buru, dan belum divalidasi. Pada simulasi agen buatan, skor estimasi berkorelasi 0,99 dengan skor asli, tetapi itu hanya menguji bahwa estimatornya berjalan bila modelnya benar.","This score depends on the calculation model (not a guess you typed), also drops with fear of loss, boredom, or hurry, and is not validated. In a simulation of artificial agents, the estimated score correlated 0.99 with the true score, but that only tests that the estimator works when the model is true.")+'</p>';
  show('<h1>'+c("Laporan Tugas Penundaan Imbalan","Delayed Reward Task Report")+'</h1><p class="mute">'+c("Dibuat ","Created ")+new Date().toLocaleString(LG==="id"?"id-ID":"en-GB")+". "+c("Prototipe, bukan alat diagnosis.","Prototype, not a diagnostic tool.")+'</p>'+HERO+'<p>'+c("Skor <b>","Score <b>")+score+c("</b> dari "+log.length+" putaran. Hangus di "," of "+log.length+" rounds</b>. Expired in ")+bursts+c(" putaran."," rounds.")+'</p>'+
  '<h2>'+c("Apa yang ditunjukkan pengalamanmu","What your experience pointed to")+'</h2><p>'+words(bg,0,c("Rata-rata riwayat putaranmu mengarah ke kesimpulan bahwa kondisi lebih aman dari kenyataan: ideal rasional dari pengalamanmu lebih lama X detik dari ideal sebenarnya.","On average your round history pointed to conditions being safer than they were: the rational ideal from your experience was X seconds longer than the true ideal."),c("Rata-rata riwayat putaranmu mengarah ke kesimpulan bahwa kondisi lebih berbahaya dari kenyataan: ideal rasional dari pengalamanmu lebih singkat X detik dari ideal sebenarnya.","On average your round history pointed to conditions being more dangerous than they were: the rational ideal from your experience was X seconds shorter than the true ideal."),c("Pengalamanmu cukup akurat menunjukkan tingkat bahaya tiap kondisi.","Your experience showed the conditions’ danger fairly accurately."))+'</p>'+
  '<h2>'+c("Apa yang kamu lakukan","What you did")+'</h2><p>'+words(cg,0,c("Kamu menunggu rata-rata X detik lebih lama dari ideal rasional berdasarkan pengalamanmu.","You waited on average X seconds longer than the rational ideal from your experience."),c("Kamu menekan Ambil rata-rata X detik lebih cepat dari ideal rasional berdasarkan pengalamanmu.","You pressed Take on average X seconds sooner than the rational ideal from your experience."),c("Waktu Ambilmu sejalan dengan ideal rasional dari pengalamanmu.","Your Take timing matched the rational ideal from your experience."))+'</p><p class="mute">'+c("Dua angka dipisah dengan sengaja: yang pertama soal seberapa jauh pengalamanmu menyesatkan, yang kedua soal selisih antara yang kamu lakukan dan yang rasional. Tes ini tidak menanyakan tebakanmu langsung.","The two numbers are kept apart on purpose: the first is about how far your experience misled, the second about the gap between what you did and what was rational. The task never asks for your guess directly.")+'</p>'+
  '<h2>'+c("Dari tebakan awal ke pengalaman","From starting guess to experience")+'</h2><p>'+c("Tebakan awal (prior) 33% / 33% / 33% punya ketidakpastian 1,58 bit. Rata-rata selama main, ketidakpastian itu turun jadi "+f1(H)+" bit. Suasana yang paling mungkin menurut perhitungan Bayes cocok dengan suasana asli di "+pct(ok)+" putaran (kebetulan murni kira-kira 33%).","The starting guess (prior) of 33% / 33% / 33% carries 1.58 bits of uncertainty. Averaged over play, that uncertainty fell to "+f1(H).replace(",",".")+" bits. The most likely mood by Bayes’ rule matched the true mood in "+pct(ok)+" of rounds (pure chance is about 33%).")+'</p>'+
  '<h2>'+c("Waktu tunggu tiap putaran (detik)","Wait time per round (seconds)")+'</h2>'+chart([{v:tru,c:"#12A87A",dash:true},{v:bel,c:"#E08A00"},{v:act,c:INK,dots:true}],ymax,c("Waktu Ambil aktual, ideal rasional dari pengalaman, dan ideal sebenarnya","Actual Take time, rational ideal from experience, and true ideal"))+
  '<div class="leg"><span><b style="background:'+INK+'"></b>'+c("Waktu kamu menekan Ambil","When you pressed Take")+'</span><span><b style="background:#E08A00"></b>'+c("Ideal rasional dari pengalamanmu (hitungan)","Rational ideal from your experience (calculated)")+'</span><span><b style="background:#12A87A"></b>'+c("Ideal sebenarnya (suasana asli diketahui)","True ideal (real mood known)")+'</span></div>'+
  SKX+EXPL+'<h2>'+c("Parameter sesi","Session parameters")+'</h2><table class="tbl"><tr><th>'+c("Kondisi","Condition")+'</th><th>'+c("Naik per tik","Rise per tick")+'</th><th>'+c("Durasi tik","Tick length")+'</th><th>'+c("Penuh (10)","Full (10)")+'</th><th>'+c("Peluang hangus per tik (tenang, sedang, ganas)","Expiry chance per tick (calm, medium, wild)")+'</th></tr>'+rows+'</table><p class="mute">'+c("Tik pertama selalu aman; imbalan muncul 0,7 detik sebelum naik. Peluang ganti suasana "+pct(EPS)+" per putaran. Prior 33% / 33% / 33% di awal tiap blok. 4 blok × 50 putaran, urutan kondisi diacak.","The first tick is always safe; the reward appears 0.7 s before rising. Mood switch chance "+pct(EPS)+" per round. Prior 33% / 33% / 33% at the start of each block. 4 blocks × 50 rounds, condition order randomized.")+'</p>'+
  '<h2>'+c("Catatan","Notes")+'</h2><ul class="mute"><li>'+c("Perhitungan memakai model sederhana: peserta dianggap memperbarui tebakan dengan aturan Bayes (Bayes, 1763), dengan kemungkinan suasana berganti seperti pada model change-point (Behrens dkk., 2007; Adams & MacKay, 2007). Ketidakpastian diukur dengan entropi Shannon (Shannon, 1948). Hasilnya estimasi, bukan fakta tentang dirimu.","The calculation uses a simple model: the participant is assumed to update their guess by Bayes’ rule (Bayes, 1763), with moods that can switch as in change-point models (Behrens et al., 2007; Adams & MacKay, 2007). Uncertainty is measured with Shannon entropy (Shannon, 1948). The result is an estimate, not a fact about you.")+'</li><li>'+c("Menunggu dengan risiko hangus yang tidak diketahui mengikuti gagasan bahwa berhenti cepat bisa masuk akal bila lingkungan dinilai tidak bisa dipercaya (Kidd dkk., 2013; McGuire & Kable, 2013). Imbalan yang membesar mirip BART (Lejuez dkk., 2002), tetapi di sini risikonya berubah-ubah dan poin dibatasi 10. Menunggu demi hadiah lebih besar berasal dari tradisi tugas penundaan kepuasan (Mischel dkk., 1972).","Waiting under an unknown expiry risk follows the idea that stopping early can be reasonable when the environment seems unreliable (Kidd et al., 2013; McGuire & Kable, 2013). The growing reward resembles the BART (Lejuez et al., 2002), but here the risk shifts over time and points are capped at 10. Waiting for a larger reward comes from the delay-of-gratification tradition (Mischel et al., 1972).")+'</li><li>'+c("Tes perilaku untuk kontrol diri umumnya punya reliabilitas uji-ulang rendah dan hubungan lemah sampai sedang dengan kuesioner (Enkavi dkk., 2019; Duckworth & Kern, 2011). Tes ini belum divalidasi: rujukan di bawah menjadi dasar konsep, bukan bukti bahwa tes ini valid.","Behavioral self-control tasks generally show low test-retest reliability and weak to moderate links with questionnaires (Enkavi et al., 2019; Duckworth & Kern, 2011). This task is not validated: the references below support the concepts, not the validity of this task.")+'</li><li>'+c("Angka menahan diri hanya dihitung dari putaran yang kamu Ambil, karena putaran yang hangus tidak menunjukkan berapa lama kamu sebenarnya mau menunggu.","The holding-back number uses only rounds you banked, because a expired round does not show how long you actually meant to wait.")+'</li></ul>'+
  '<h2>'+c("Rujukan","References")+'</h2><ol class="refs">'+REFS.map(r=>"<li>"+r+"</li>").join("")+'</ol><p class="mute">'+c("Rujukan menjadi dasar konsep. Parameter (peluang, kecepatan naik, batas 10 poin) adalah rancangan prototipe ini dan belum dikalibrasi pada data peserta.","References support the concepts. The parameters (chances, rise speed, 10-point cap) are this prototype’s design and have not been calibrated on participant data.")+'</p>'+
  '<p class="noprint"><button id="pdf">'+c("Unduh PDF","Download PDF")+'</button> <button class="alt" id="again">'+c("Main lagi","Play again")+'</button> <button class="alt" id="csv">'+c("CSV per putaran","CSV per round")+'</button> <button class="alt" id="csvs">'+c("CSV ringkasan","CSV summary")+'</button> <button class="alt" id="copy">'+c("Salin data (JSON)","Copy data (JSON)")+'</button></p><p class="mute noprint" id="cm" role="status">'+c("Unduh PDF membuka jendela cetak: pilih Simpan sebagai PDF.","Download PDF opens the print dialog: choose Save as PDF.")+'</p>',true);
  document.getElementById("pdf").onclick=()=>{const d=document.title;document.title="Laporan-Tugas-Imbalan-"+new Date().toISOString().slice(0,10);window.print();setTimeout(()=>{document.title=d},500)};
  document.getElementById("csv").onclick=csv;
  document.getElementById("csvs").onclick=csvSum;
  document.getElementById("again").onclick=()=>{newSession();slide=0;intro()};
  document.getElementById("copy").onclick=()=>{
    const j=JSON.stringify(log.map((x,i)=>({putaran:i+1,blok:Math.floor(i/PER)+1,kondisi:ST[x.s].n,suasana:REG[x.reg],peluang_hangus:x.h,tik_ambil:x.n,hangus:x.burst,poin:x.pts,tik_ideal_tebakan:x.Tb,tik_ideal_asli:x.Tt,entropi_bit:+x.H.toFixed(3)})),null,1);
    const cm=document.getElementById("cm");
    (navigator.clipboard?navigator.clipboard.writeText(j):Promise.reject()).then(()=>cm.textContent=c("Data tersalin.","Data copied.")).catch(()=>cm.textContent=c("Gagal menyalin. Buka lewat alamat https atau file lokal.","Copy failed. Open via https or a local file."));
  };
  autoSend();
}
document.addEventListener("keydown",e=>{
  if(e.code==="Space"&&cur&&!cur.done&&document.getElementById("take")){e.preventDefault();end(false)}
});
document.addEventListener("keyup",e=>{
  if(e.code!=="Space"||Date.now()<GO_AT)return;
  if(document.getElementById("go")){e.preventDefault();startRound();return}
  if(document.getElementById("nx")&&slide===1){e.preventDefault();begin()}
});
hook();
</script>
